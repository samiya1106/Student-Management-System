{% extends "base.html" %}
{% block title %}{{ title }} - Student Management System{% endblock %}

{% block content %}
<section class="card form-card confirm-card">
    <div class="error-code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <div class="form-actions">
        <a class="btn btn-primary" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </div>
</section>
{% endblock %}
